name: CI / CD Pipeline - 极简智能收银系统

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  test-and-lint:
    name: 静态代码检查与核心单元测试 (Lint & Test)
    runs-on: ubuntu-latest
    steps:
      - name: 检出源码 (Checkout Code)
        uses: actions/checkout@v4

      - name: 配置 Go 环境 (Setup Go)
        uses: actions/setup-go@v5
        with:
          go-version: '1.20'
          cache: true

      - name: 下载依赖与模块校验 (Download Dependencies)
        run: go mod download && go mod verify

      - name: 静态代码安全与规范检查 (Go Vet)
        run: |
          go vet ./...

      - name: 运行核心算法单元测试与并发测试 (Run Unit Tests)
        run: |
          go test -v -race -coverprofile=coverage.out ./...

      - name: 输出测试覆盖率报告 (Coverage Summary)
        run: |
          go tool cover -func=coverage.out

  build-cross-platform:
    name: 跨平台多架构编译验证 (Cross-Platform Build Matrix)
    needs: test-and-lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
            output: modern-pos-linux-amd64
          - os: windows
            arch: amd64
            output: modern-pos-windows-amd64.exe
          - os: darwin
            arch: arm64
            output: modern-pos-darwin-arm64
          - os: darwin
            arch: amd64
            output: modern-pos-darwin-amd64
    steps:
      - name: 检出源码 (Checkout Code)
        uses: actions/checkout@v4

      - name: 配置 Go 环境 (Setup Go)
        uses: actions/setup-go@v5
        with:
          go-version: '1.20'
          cache: true

      - name: 编译生产构建二进制执行文件 (Build Production Binary)
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 0
        run: |
          mkdir -p dist
          go build -ldflags="-s -w" -o dist/${{ matrix.output }} .

      - name: 编译调试测试标签二进制执行文件 (Build Debug Binary)
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 0
        run: |
          go build -tags debug -ldflags="-s -w" -o dist/debug-${{ matrix.output }} .

      - name: 上传构建产物至 CI 归档 (Upload Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: modern-pos-binaries-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*
          retention-days: 7
